# スラッシュ／hybrid コマンドの description / パラメータ説明（Discord localizations）
# 対応言語: en（フォールバック）, ja, ko, vi, zh-CN, zh-TW, es, fr, de, pt-BR, ru, th, id
# コマンド name は翻訳しない（英語固定）
# 本ファイルをそのまま読み込む（commands_i18n_config.yaml は生成しない）。
commands_i18n:
  fallback: en
  commands:
    gacha:
      description:
        en: Recruits students like in Blue Archive.
        ja: ブルーアーカイブ風の生徒募集（ガチャ）を行います。
        ko: 블루 아카이브 스타일로 학생을 모집(가챠)합니다.
        vi: Tuyển sinh viên theo phong cách Blue Archive (gacha).
        zh-CN: 像《碧蓝档案》一样招募学生。
        zh-TW: 像《蔚藍檔案》一樣招募學生。
        es: Recluta estudiantes como en Blue Archive.
        fr: Recrutez des élèves comme dans Blue Archive.
        de: Rekrutiere Schüler wie in Blue Archive.
        pt-BR: Recrute estudantes como em Blue Archive.
        ru: Набирает учеников, как в Blue Archive.
        th: รับสมัครนักเรียนแบบ Blue Archive
        id: Rekrut siswa seperti di Blue Archive.
      options:
        rolls:
          description:
            en: Select the number of recruitments.
            ja: 募集回数を選択します。
            ko: 모집 횟수를 선택합니다.
            vi: Chọn số lần tuyển sinh.
            zh-CN: 选择招募次数。
            zh-TW: 選擇招募次數。
            es: Selecciona el número de reclutamientos.
            fr: Sélectionnez le nombre de recrutements.
            de: Wähle die Anzahl der Rekrutierungen.
            pt-BR: Selecione o número de recrutamentos.
            ru: Выберите число наборов.
            th: เลือกจำนวนครั้งในการรับสมัคร
            id: Pilih jumlah perekrutan.
    serverinfo:
      description:
        en: Displays information about the current server.
        ja: 現在のサーバーに関する情報を表示します。
        ko: 현재 서버 정보를 표시합니다.
        vi: Hiển thị thông tin máy chủ hiện tại.
        zh-CN: 显示当前服务器的信息。
        zh-TW: 顯示目前伺服器的資訊。
        es: Muestra información del servidor actual.
        fr: Affiche les informations du serveur actuel.
        de: Zeigt Informationen zum aktuellen Server an.
        pt-BR: Mostra informações do servidor atual.
        ru: Показывает сведения о текущем сервере.
        th: แสดงข้อมูลเกี่ยวกับเซิร์ฟเวอร์ปัจจุบัน
        id: Menampilkan informasi server saat ini.
    userinfo:
      description:
        en: Displays information about the specified user.
        ja: 指定されたユーザーの情報を表示します。
        ko: 지정한 사용자 정보를 표시합니다.
        vi: Hiển thị thông tin người dùng đã chỉ định.
        zh-CN: 显示指定用户的信息。
        zh-TW: 顯示指定使用者的資訊。
        es: Muestra información del usuario especificado.
        fr: Affiche les informations de l'utilisateur indiqué.
        de: Zeigt Informationen zum angegebenen Benutzer an.
        pt-BR: Mostra informações do usuário especificado.
        ru: Показывает сведения об указанном пользователе.
        th: แสดงข้อมูลของผู้ใช้ที่ระบุ
        id: Menampilkan informasi pengguna yang ditentukan.
      options:
        user:
          description:
            en: User to display information for (optional, defaults to you).
            ja: 情報を表示するユーザー（任意、デフォルトはコマンド実行者）
            ko: 정보를 표시할 사용자(선택, 기본값은 실행자)
            vi: Người dùng cần hiển thị (tùy chọn, mặc định là bạn).
            zh-CN: 要显示信息的用户（可选，默认是你）。
            zh-TW: 要顯示資訊的使用者（選填，預設為你）。
            es: Usuario a mostrar (opcional; tú por defecto).
            fr: Utilisateur à afficher (facultatif, vous par défaut).
            de: Anzuzeigender Nutzer (optional, standardmäßig du).
            pt-BR: Usuário a exibir (opcional; você por padrão).
            ru: Пользователь для показа (необязательно, по умолчанию вы).
            th: ผู้ใช้ที่จะแสดง (ไม่บังคับ ค่าเริ่มต้นคือคุณ)
            id: Pengguna yang ditampilkan (opsional, default Anda).
    avatar:
      description:
        en: Displays the avatar of the specified user.
        ja: 指定されたユーザーのアバター画像URLを表示します。
        ko: 지정한 사용자의 아바타 URL을 표시합니다.
        vi: Hiển thị URL avatar của người dùng đã chỉ định.
        zh-CN: 显示指定用户的头像 URL。
        zh-TW: 顯示指定使用者的頭像 URL。
        es: Muestra el URL del avatar del usuario indicado.
        fr: Affiche l'URL de l'avatar de l'utilisateur indiqué.
        de: Zeigt die Avatar-URL des angegebenen Benutzers an.
        pt-BR: Mostra a URL do avatar do usuário especificado.
        ru: Показывает URL аватара указанного пользователя.
        th: แสดง URL รูปโปรไฟล์ของผู้ใช้ที่ระบุ
        id: Menampilkan URL avatar pengguna yang ditentukan.
      options:
        user:
          description:
            en: User whose avatar to display (optional, defaults to you).
            ja: アバターを表示するユーザー（任意、デフォルトはコマンド実行者）
            ko: 아바타를 표시할 사용자(선택, 기본값은 실행자)
            vi: Người dùng cần hiện avatar (tùy chọn, mặc định là bạn).
            zh-CN: 要显示头像的用户（可选，默认是你）。
            zh-TW: 要顯示頭像的使用者（選填，預設為你）。
            es: Usuario cuyo avatar mostrar (opcional; tú por defecto).
            fr: Utilisateur dont afficher l'avatar (facultatif, vous par défaut).
            de: Nutzer, dessen Avatar gezeigt wird (optional, standardmäßig du).
            pt-BR: Usuário cujo avatar mostrar (opcional; você por padrão).
            ru: Пользователь, чей аватар показать (необязательно, по умолчанию вы).
            th: ผู้ใช้ที่จะแสดงรูปโปรไฟล์ (ไม่บังคับ ค่าเริ่มต้นคือคุณ)
            id: Pengguna yang avatarnya ditampilkan (opsional, default Anda).
    feedback:
      description:
        en: Send a bug report or feature request.
        ja: 不具合・要望を開発者サーバーへ送ります
        ko: 버그 제보나 기능 요청을 개발자 서버로 보냅니다.
        vi: Gửi báo cáo lỗi hoặc yêu cầu tính năng.
        zh-CN: 发送错误报告或功能请求。
        zh-TW: 傳送錯誤回報或功能需求。
        es: Envía un informe de error o solicitud de función.
        fr: Envoyez un rapport de bug ou une demande de fonctionnalité.
        de: Sende einen Fehlerbericht oder Funktionswunsch.
        pt-BR: Envie um relatório de erro ou pedido de recurso.
        ru: Отправляет отчёт об ошибке или запрос функции.
        th: ส่งรายงานบั๊กหรือคำขอฟีเจอร์
        id: Kirim laporan bug atau permintaan fitur.
      options:
        category:
          description:
            en: Report category.
            ja: 報告の種類
            ko: 제보 종류
            vi: Loại báo cáo.
            zh-CN: 报告类别。
            zh-TW: 回報類別。
            es: Categoría del informe.
            fr: Catégorie du rapport.
            de: Meldekategorie.
            pt-BR: Categoria do relatório.
            ru: Категория отчёта.
            th: หมวดหมู่รายงาน
            id: Kategori laporan.
    support:
      description:
        en: Shows how to contact the developer.
        ja: 開発者へのお問い合わせ方法を表示します
        ko: 개발자에게 문의하는 방법을 표시합니다.
        vi: Hiển thị cách liên hệ nhà phát triển.
        zh-CN: 显示联系开发者的方法。
        zh-TW: 顯示聯絡開發者的方法。
        es: Muestra cómo contactar al desarrollador.
        fr: Indique comment contacter le développeur.
        de: Zeigt, wie man den Entwickler kontaktiert.
        pt-BR: Mostra como contatar o desenvolvedor.
        ru: Показывает, как связаться с разработчиком.
        th: แสดงวิธีติดต่อผู้พัฒนา
        id: Menampilkan cara menghubungi pengembang.
    invite:
      description:
        en: Shows invite links for PLANA and ARONA.
        ja: PLANA / ARONA の招待リンクを表示します。
        ko: PLANA / ARONA 초대 링크를 표시합니다.
        vi: Hiển thị liên kết mời PLANA và ARONA.
        zh-CN: 显示 PLANA 和 ARONA 的邀请链接。
        zh-TW: 顯示 PLANA 和 ARONA 的邀請連結。
        es: Muestra enlaces de invitación para PLANA y ARONA.
        fr: Affiche les liens d'invitation de PLANA et ARONA.
        de: Zeigt Einladungslinks für PLANA und ARONA.
        pt-BR: Mostra links de convite para PLANA e ARONA.
        ru: Показывает ссылки-приглашения PLANA и ARONA.
        th: แสดงลิงก์เชิญสำหรับ PLANA และ ARONA
        id: Menampilkan tautan undangan PLANA dan ARONA.
    updates:
      description:
        en: Shows the bot's latest update history (commit log).
        ja: Botの最新のアップデート履歴（コミットログ）を表示します。
        ko: 봇의 최신 업데이트 기록(커밋 로그)을 표시합니다.
        vi: Hiển thị lịch sử cập nhật mới nhất của bot (commit log).
        zh-CN: 显示机器人的最新更新历史（提交日志）。
        zh-TW: 顯示機器人的最新更新紀錄（提交日誌）。
        es: Muestra el historial reciente de actualizaciones del bot.
        fr: Affiche l'historique des dernières mises à jour du bot.
        de: Zeigt die neuesten Aktualisierungen des Bots an.
        pt-BR: Mostra o histórico recente de atualizações do bot.
        ru: Показывает последние обновления бота.
        th: แสดงประวัติการอัปเดตล่าสุดของบอต
        id: Menampilkan riwayat pembaruan terbaru bot.
    help:
      description:
        en: Displays help information for the bot.
        ja: Botのヘルプ情報を表示します。
        ko: 봇의 도움말 정보를 표시합니다.
        vi: Hiển thị thông tin trợ giúp của bot.
        zh-CN: 显示机器人的帮助信息。
        zh-TW: 顯示機器人的說明資訊。
        es: Muestra la ayuda del bot.
        fr: Affiche l'aide du bot.
        de: Zeigt die Hilfe für den Bot an.
        pt-BR: Mostra a ajuda do bot.
        ru: Показывает справку по боту.
        th: แสดงข้อมูลช่วยเหลือของบอต
        id: Menampilkan bantuan bot.
    chat:
      description:
        en: Chat with the AI without needing to mention.
        ja: AIと対話します。メンション不要で会話できます。
        ko: 멘션 없이 AI와 대화합니다.
        vi: Trò chuyện với AI mà không cần mention.
        zh-CN: 无需提及即可与 AI 聊天。
        zh-TW: 無需提及即可與 AI 聊天。
        es: Chatea con la IA sin necesidad de mencionarla.
        fr: Discutez avec l'IA sans la mentionner.
        de: Chatte mit der KI, ohne sie zu erwähnen.
        pt-BR: Converse com a IA sem precisar mencioná-la.
        ru: Общайтесь с ИИ без упоминания.
        th: สนทนากับ AI โดยไม่ต้องเมนชัน
        id: Mengobrol dengan AI tanpa menyebutnya.
      options:
        message:
          description:
            en: The message you want to send to the AI.
            ja: AIに送信したいメッセージ
            ko: AI에 보낼 메시지
            vi: Tin nhắn gửi tới AI.
            zh-CN: 要发送给 AI 的消息。
            zh-TW: 要傳送給 AI 的訊息。
            es: El mensaje que quieres enviar a la IA.
            fr: Le message à envoyer à l'IA.
            de: Die Nachricht, die du der KI senden möchtest.
            pt-BR: A mensagem que deseja enviar à IA.
            ru: Сообщение, которое вы хотите отправить ИИ.
            th: ข้อความที่ต้องการส่งให้ AI
            id: Pesan yang ingin dikirim ke AI.
        image_url:
          description:
            en: URL of an image (optional).
            ja: 画像のURL（オプション）
            ko: 이미지 URL(선택)
            vi: URL hình ảnh (tùy chọn).
            zh-CN: 图片 URL（可选）。
            zh-TW: 圖片 URL（選填）。
            es: URL de una imagen (opcional).
            fr: URL d'une image (facultatif).
            de: URL eines Bildes (optional).
            pt-BR: URL de uma imagem (opcional).
            ru: URL изображения (необязательно).
            th: URL ของรูปภาพ (ไม่บังคับ)
            id: URL gambar (opsional).
    switch-models:
      description:
        en: Switches the AI model used for this channel.
        ja: このチャンネルで使用するAIモデルを切り替えます。
        ko: 이 채널에서 사용할 AI 모델을 전환합니다.
        vi: Chuyển mô hình AI dùng cho kênh này.
        zh-CN: 切换此频道使用的 AI 模型。
        zh-TW: 切換此頻道使用的 AI 模型。
        es: Cambia el modelo de IA de este canal.
        fr: Change le modèle d'IA utilisé pour ce canal.
        de: Wechselt das KI-Modell dieses Kanals.
        pt-BR: Alterna o modelo de IA usado neste canal.
        ru: Меняет модель ИИ для этого канала.
        th: เปลี่ยนโมเดล AI ที่ใช้ในช่องนี้
        id: Ganti model AI yang digunakan kanal ini.
      options:
        model:
          description:
            en: Select the model you want to use.
            ja: 使用したいモデルを選択してください。
            ko: 사용할 모델을 선택하세요.
            vi: Chọn mô hình bạn muốn dùng.
            zh-CN: 选择要使用的模型。
            zh-TW: 選擇要使用的模型。
            es: Selecciona el modelo que quieres usar.
            fr: Sélectionnez le modèle à utiliser.
            de: Wähle das Modell aus, das du verwenden möchtest.
            pt-BR: Selecione o modelo que deseja usar.
            ru: Выберите модель для использования.
            th: เลือกโมเดลที่ต้องการใช้
            id: Pilih model yang ingin digunakan.
    switch-models-default-server:
      description:
        en: Resets the AI model for this channel to the server default.
        ja: このチャンネルのAIモデルをサーバーのデフォルト設定に戻します。
        ko: 이 채널의 AI 모델을 서버 기본값으로 되돌립니다.
        vi: Đặt lại mô hình AI của kênh về mặc định máy chủ.
        zh-CN: 将此频道的 AI 模型重置为服务器默认值。
        zh-TW: 將此頻道的 AI 模型重設為伺服器預設值。
        es: Restablece el modelo de IA al predeterminado del servidor.
        fr: Réinitialise le modèle d'IA à celui par défaut du serveur.
        de: Setzt das KI-Modell auf den Serverstandard zurück.
        pt-BR: Redefine o modelo de IA para o padrão do servidor.
        ru: Сбрасывает модель ИИ к значению сервера.
        th: รีเซ็ตโมเดล AI ของช่องเป็นค่าเริ่มต้นเซิร์ฟเวอร์
        id: Atur ulang model AI ke default server.
    switch-image-model:
      description:
        en: Switch the image generation model for this channel.
        ja: このチャンネルの画像生成モデルを切り替えます。
        ko: 이 채널의 이미지 생성 모델을 전환합니다.
        vi: Chuyển mô hình tạo ảnh cho kênh này.
        zh-CN: 切换此频道的图像生成模型。
        zh-TW: 切換此頻道的圖片生成模型。
        es: Cambia el modelo de generación de imágenes de este canal.
        fr: Change le modèle de génération d'images de ce canal.
        de: Wechselt das Bildgenerierungsmodell dieses Kanals.
        pt-BR: Alterna o modelo de geração de imagens deste canal.
        ru: Меняет модель генерации изображений для канала.
        th: เปลี่ยนโมเดลสร้างภาพของช่องนี้
        id: Ganti model pembuatan gambar kanal ini.
      options:
        model:
          description:
            en: Select the image generation model you want to use.
            ja: 使用したい画像生成モデルを選択してください。
            ko: 사용할 이미지 생성 모델을 선택하세요.
            vi: Chọn mô hình tạo ảnh bạn muốn dùng.
            zh-CN: 选择要使用的图像生成模型。
            zh-TW: 選擇要使用的圖片生成模型。
            es: Selecciona el modelo de generación de imágenes.
            fr: Sélectionnez le modèle de génération d'images.
            de: Wähle das Bildgenerierungsmodell aus.
            pt-BR: Selecione o modelo de geração de imagens.
            ru: Выберите модель генерации изображений.
            th: เลือกโมเดลสร้างภาพที่ต้องการใช้
            id: Pilih model pembuatan gambar yang ingin digunakan.
    show-image-model:
      description:
        en: Show the current image generation model for this channel.
        ja: このチャンネルの現在の画像生成モデルを表示します。
        ko: 이 채널의 현재 이미지 생성 모델을 표시합니다.
        vi: Hiển thị mô hình tạo ảnh hiện tại của kênh.
        zh-CN: 显示此频道当前的图像生成模型。
        zh-TW: 顯示此頻道目前的圖片生成模型。
        es: Muestra el modelo de generación de imágenes actual.
        fr: Affiche le modèle de génération d'images actuel.
        de: Zeigt das aktuelle Bildgenerierungsmodell an.
        pt-BR: Mostra o modelo de geração de imagens atual.
        ru: Показывает текущую модель генерации изображений.
        th: แสดงโมเดลสร้างภาพปัจจุบันของช่องนี้
        id: Menampilkan model pembuatan gambar saat ini.
    list-image-models:
      description:
        en: List all available image generation models.
        ja: 利用可能な画像生成モデルの一覧を表示します。
        ko: 사용 가능한 이미지 생성 모델 목록을 표시합니다.
        vi: Liệt kê tất cả mô hình tạo ảnh khả dụng.
        zh-CN: 列出所有可用的图像生成模型。
        zh-TW: 列出所有可用的圖片生成模型。
        es: Lista todos los modelos de generación de imágenes disponibles.
        fr: Liste tous les modèles de génération d'images disponibles.
        de: Listet alle verfügbaren Bildgenerierungsmodelle auf.
        pt-BR: Lista todos os modelos de geração de imagens disponíveis.
        ru: Показывает все доступные модели генерации изображений.
        th: แสดงรายการโมเดลสร้างภาพที่ใช้ได้ทั้งหมด
        id: Daftar semua model pembuatan gambar yang tersedia.
      options:
        provider:
          description:
            en: Filter by provider (optional).
            ja: プロバイダーで絞り込み（オプション）
            ko: 제공자로 필터(선택)
            vi: Lọc theo nhà cung cấp (tùy chọn).
            zh-CN: 按提供商筛选（可选）。
            zh-TW: 依提供者篩選（選填）。
            es: Filtra por proveedor (opcional).
            fr: Filtre par fournisseur (facultatif).
            de: Nach Anbieter filtern (optional).
            pt-BR: Filtre por provedor (opcional).
            ru: Фильтр по провайдеру (необязательно).
            th: กรองตามผู้ให้บริการ (ไม่บังคับ)
            id: Filter berdasarkan penyedia (opsional).
    clear_history:
      description:
        en: Clears the history of the current conversation thread.
        ja: 現在の会話スレッドの履歴をクリアします。
        ko: 현재 대화 스레드의 기록을 지웁니다.
        vi: Xóa lịch sử luồng hội thoại hiện tại.
        zh-CN: 清除当前对话线程的历史记录。
        zh-TW: 清除目前對話串的歷史紀錄。
        es: Borra el historial del hilo de conversación actual.
        fr: Efface l'historique du fil de conversation actuel.
        de: Löscht den Verlauf des aktuellen Gesprächsthreads.
        pt-BR: Limpa o histórico da conversa atual.
        ru: Очищает историю текущей беседы.
        th: ล้างประวัติของเธรดการสนทนาปัจจุบัน
        id: Hapus riwayat percakapan saat ini.
    play:
      description:
        en: Play a song or add it to the queue.
        ja: 曲を再生またはキューに追加します。
        ko: 곡을 재생하거나 대기열에 추가합니다.
        vi: Phát bài hát hoặc thêm vào hàng đợi.
        zh-CN: 播放歌曲或将其加入队列。
        zh-TW: 播放歌曲或將其加入佇列。
        es: Reproduce una canción o la añade a la cola.
        fr: Joue une chanson ou l'ajoute à la file.
        de: Spielt einen Song oder fügt ihn zur Warteschlange hinzu.
        pt-BR: Toca uma música ou a adiciona à fila.
        ru: Воспроизводит трек или добавляет в очередь.
        th: เล่นเพลงหรือเพิ่มเข้าคิว
        id: Putar lagu atau tambahkan ke antrean.
      options:
        query:
          description:
            en: Song title or URL to play.
            ja: 再生したい曲のタイトル、またはURL
            ko: 재생할 곡 제목 또는 URL
            vi: Tiêu đề bài hát hoặc URL cần phát.
            zh-CN: 要播放的歌曲标题或 URL。
            zh-TW: 要播放的歌曲標題或 URL。
            es: Título o URL de la canción.
            fr: Titre ou URL de la chanson.
            de: Songtitel oder URL.
            pt-BR: Título ou URL da música.
            ru: Название или URL трека.
            th: ชื่อเพลงหรือ URL ที่จะเล่น
            id: Judul lagu atau URL untuk diputar.
    seek:
      description:
        en: Seek to a specified time in the track.
        ja: 再生位置を指定した時刻に移動します。
        ko: 재생 위치를 지정한 시각으로 이동합니다.
        vi: Nhảy đến thời điểm chỉ định trong bài.
        zh-CN: 跳转到曲目中的指定时间。
        zh-TW: 跳到曲目中的指定時間。
        es: Salta a un tiempo concreto de la pista.
        fr: Va à un instant précis de la piste.
        de: Springt zu einer Zeitstelle im Track.
        pt-BR: Pula para um tempo na faixa.
        ru: Переход к указанному времени трека.
        th: เลื่อนไปยังเวลาที่ระบุในเพลง
        id: Lompat ke waktu tertentu di trek.
      options:
        time:
          description:
            en: Seek target (e.g. 1:30 or 90 seconds).
            ja: '移動先の時刻 (例: 1:30 または 90 秒)'
            ko: '이동할 시각(예: 1:30 또는 90초)'
            vi: 'Thời điểm đích (vd: 1:30 hoặc 90 giây).'
            zh-CN: 跳转目标（例如 1:30 或 90 秒）。
            zh-TW: 跳轉目標（例如 1:30 或 90 秒）。
            es: Destino (p. ej. 1:30 o 90 segundos).
            fr: Cible (ex. 1:30 ou 90 secondes).
            de: Zielzeit (z. B. 1:30 oder 90 Sekunden).
            pt-BR: 'Destino (ex.: 1:30 ou 90 segundos).'
            ru: Цель (напр. 1:30 или 90 секунд).
            th: เป้าหมาย (เช่น 1:30 หรือ 90 วินาที)
            id: Target seek (mis. 1:30 atau 90 detik).
    pause:
      description:
        en: Pause playback.
        ja: 再生を一時停止します。
        ko: 재생을 일시정지합니다.
        vi: Tạm dừng phát.
        zh-CN: 暂停播放。
        zh-TW: 暫停播放。
        es: Pausa la reproducción.
        fr: Met la lecture en pause.
        de: Pausiert die Wiedergabe.
        pt-BR: Pausa a reprodução.
        ru: Приостанавливает воспроизведение.
        th: หยุดเล่นชั่วคราว
        id: Jeda pemutaran.
    resume:
      description:
        en: Resume paused playback.
        ja: 一時停止中の再生を再開します。
        ko: 일시정지된 재생을 재개합니다.
        vi: Tiếp tục phát đã tạm dừng.
        zh-CN: 恢复已暂停的播放。
        zh-TW: 繼續已暫停的播放。
        es: Reanuda la reproducción en pausa.
        fr: Reprend la lecture en pause.
        de: Setzt die pausierte Wiedergabe fort.
        pt-BR: Retoma a reprodução pausada.
        ru: Возобновляет паузу.
        th: เล่นต่อจากที่หยุดชั่วคราว
        id: Lanjutkan pemutaran yang dijeda.
    skip:
      description:
        en: Skip the current track.
        ja: 再生中の曲をスキップします。
        ko: 현재 곡을 건너뜁니다.
        vi: Bỏ qua bài đang phát.
        zh-CN: 跳过当前曲目。
        zh-TW: 跳過目前曲目。
        es: Salta la pista actual.
        fr: Passe la piste actuelle.
        de: Überspringt den aktuellen Track.
        pt-BR: Pula a faixa atual.
        ru: Пропускает текущий трек.
        th: ข้ามเพลงปัจจุบัน
        id: Lewati trek saat ini.
    stop:
      description:
        en: Stop playback and clear the queue.
        ja: 再生を停止し、キューをクリアします。
        ko: 재생을 중지하고 대기열을 비웁니다.
        vi: Dừng phát và xóa hàng đợi.
        zh-CN: 停止播放并清空队列。
        zh-TW: 停止播放並清空佇列。
        es: Detiene la reproducción y vacía la cola.
        fr: Arrête la lecture et vide la file.
        de: Stoppt die Wiedergabe und leert die Warteschlange.
        pt-BR: Para a reprodução e limpa a fila.
        ru: Останавливает воспроизведение и очищает очередь.
        th: หยุดเล่นและล้างคิว
        id: Hentikan pemutaran dan kosongkan antrean.
    leave:
      description:
        en: Disconnect the bot from the voice channel.
        ja: ボットをボイスチャンネルから切断します。
        ko: 봇을 음성 채널에서 연결 해제합니다.
        vi: Ngắt bot khỏi kênh thoại.
        zh-CN: 将机器人从语音频道断开。
        zh-TW: 將機器人從語音頻道斷開。
        es: Desconecta el bot del canal de voz.
        fr: Déconnecte le bot du salon vocal.
        de: Trennt den Bot vom Sprachkanal.
        pt-BR: Desconecta o bot do canal de voz.
        ru: Отключает бота от голосового канала.
        th: ตัดบอทออกจากช่องเสียง
        id: Putuskan bot dari saluran suara.
    queue:
      description:
        en: Show the current playback queue.
        ja: 現在の再生キューを表示します。
        ko: 현재 재생 대기열을 표시합니다.
        vi: Hiển thị hàng đợi phát hiện tại.
        zh-CN: 显示当前播放队列。
        zh-TW: 顯示目前播放佇列。
        es: Muestra la cola de reproducción.
        fr: Affiche la file de lecture.
        de: Zeigt die aktuelle Warteschlange.
        pt-BR: Mostra a fila de reprodução.
        ru: Показывает текущую очередь.
        th: แสดงคิวการเล่นปัจจุบัน
        id: Tampilkan antrean pemutaran saat ini.
    nowplaying:
      description:
        en: Show info about the currently playing track.
        ja: 現在再生中の曲の情報を表示します。
        ko: 현재 재생 중인 곡 정보를 표시합니다.
        vi: Hiển thị thông tin bài đang phát.
        zh-CN: 显示当前播放曲目的信息。
        zh-TW: 顯示目前播放曲目的資訊。
        es: Muestra info de la pista actual.
        fr: Affiche les infos de la piste en cours.
        de: Zeigt Infos zum aktuellen Track.
        pt-BR: Mostra info da faixa atual.
        ru: Показывает информацию о текущем треке.
        th: แสดงข้อมูลเพลงที่กำลังเล่น
        id: Tampilkan info trek yang sedang diputar.
    shuffle:
      description:
        en: Shuffle the playback queue.
        ja: 再生キューをシャッフルします。
        ko: 재생 대기열을 섞습니다.
        vi: Xáo trộn hàng đợi phát.
        zh-CN: 打乱播放队列。
        zh-TW: 打亂播放佇列。
        es: Mezcla la cola de reproducción.
        fr: Mélange la file de lecture.
        de: Mischt die Warteschlange.
        pt-BR: Embaralha a fila de reprodução.
        ru: Перемешивает очередь.
        th: สลับคิวการเล่น
        id: Acak antrean pemutaran.
    clear:
      description:
        en: Clear the queue (does not stop the current track).
        ja: 再生キューを空にします（再生中の曲は停止しません）。
        ko: 대기열을 비웁니다(현재 곡은 중지하지 않음).
        vi: Xóa hàng đợi (không dừng bài đang phát).
        zh-CN: 清空队列（不停止当前曲目）。
        zh-TW: 清空佇列（不停止目前曲目）。
        es: Vacía la cola (no detiene la pista actual).
        fr: Vide la file (ne stoppe pas la piste).
        de: Leert die Warteschlange (stoppt den Track nicht).
        pt-BR: Limpa a fila (não para a faixa atual).
        ru: Очищает очередь (не останавливает трек).
        th: ล้างคิว (ไม่หยุดเพลงปัจจุบัน)
        id: Kosongkan antrean (tidak menghentikan trek).
    remove:
      description:
        en: Remove a track from the queue by number.
        ja: キューから指定した番号の曲を削除します。
        ko: 대기열에서 지정 번호의 곡을 제거합니다.
        vi: Xóa bài khỏi hàng đợi theo số thứ tự.
        zh-CN: 按编号从队列中移除曲目。
        zh-TW: 依編號從佇列移除曲目。
        es: Quita una pista de la cola por número.
        fr: Retire une piste de la file par numéro.
        de: Entfernt einen Track anhand der Nummer.
        pt-BR: Remove uma faixa da fila pelo número.
        ru: Удаляет трек из очереди по номеру.
        th: ลบเพลงจากคิวตามหมายเลข
        id: Hapus trek dari antrean menurut nomor.
      options:
        index:
          description:
            en: Queue position to remove.
            ja: 削除したい曲のキュー番号
            ko: 제거할 곡의 대기열 번호
            vi: Vị trí trong hàng đợi cần xóa.
            zh-CN: 要移除的队列位置。
            zh-TW: 要移除的佇列位置。
            es: Posición en la cola a quitar.
            fr: Position dans la file à retirer.
            de: Warteschlangenposition zum Entfernen.
            pt-BR: Posição na fila a remover.
            ru: Позиция в очереди для удаления.
            th: ตำแหน่งในคิวที่จะลบ
            id: Posisi antrean yang dihapus.
    volume:
      description:
        en: Change the volume (0-200).
        ja: 音量を変更します (0-200)。
        ko: 음량을 변경합니다(0-200).
        vi: Đổi âm lượng (0-200).
        zh-CN: 更改音量（0-200）。
        zh-TW: 變更音量（0-200）。
        es: Cambia el volumen (0-200).
        fr: Change le volume (0-200).
        de: Ändert die Lautstärke (0-200).
        pt-BR: Altera o volume (0-200).
        ru: Изменяет громкость (0-200).
        th: เปลี่ยนระดับเสียง (0-200)
        id: Ubah volume (0-200).
      options:
        level:
          description:
            en: Volume level to set (0-200).
            ja: 設定したい音量レベル (0-200)
            ko: 설정할 음량 레벨(0-200)
            vi: Mức âm lượng cần đặt (0-200).
            zh-CN: 要设置的音量（0-200）。
            zh-TW: 要設定的音量（0-200）。
            es: Nivel de volumen (0-200).
            fr: Niveau de volume (0-200).
            de: Lautstärkepegel (0-200).
            pt-BR: Nível de volume (0-200).
            ru: Уровень громкости (0-200).
            th: ระดับเสียงที่จะตั้ง (0-200)
            id: Level volume yang diatur (0-200).
    loop:
      description:
        en: Set the loop playback mode.
        ja: ループ再生モードを設定します。
        ko: 반복 재생 모드를 설정합니다.
        vi: Đặt chế độ phát lặp.
        zh-CN: 设置循环播放模式。
        zh-TW: 設定循環播放模式。
        es: Configura el modo de bucle.
        fr: Définit le mode de boucle.
        de: Stellt den Loop-Modus ein.
        pt-BR: Define o modo de repetição.
        ru: Задаёт режим повтора.
        th: ตั้งโหมดเล่นวนซ้ำ
        id: Atur mode putar berulang.
      options:
        mode:
          description:
            en: Select the loop mode.
            ja: ループのモードを選択してください。
            ko: 반복 모드를 선택하세요.
            vi: Chọn chế độ lặp.
            zh-CN: 选择循环模式。
            zh-TW: 選擇循環模式。
            es: Selecciona el modo de bucle.
            fr: Choisissez le mode de boucle.
            de: Wähle den Loop-Modus.
            pt-BR: Selecione o modo de repetição.
            ru: Выберите режим повтора.
            th: เลือกโหมดวนซ้ำ
            id: Pilih mode pengulangan.
    join:
      description:
        en: Join your voice channel.
        ja: ボットをあなたのいるボイスチャンネルに接続します。
        ko: 봇을 당신이 있는 음성 채널에 연결합니다.
        vi: Kết nối bot vào kênh thoại của bạn.
        zh-CN: 加入你所在的语音频道。
        zh-TW: 加入你所在的語音頻道。
        es: Une el bot a tu canal de voz.
        fr: Rejoint votre salon vocal.
        de: Tritt deinem Sprachkanal bei.
        pt-BR: Entra no seu canal de voz.
        ru: Подключается к вашему голосовому каналу.
        th: เข้าร่วมช่องเสียงของคุณ
