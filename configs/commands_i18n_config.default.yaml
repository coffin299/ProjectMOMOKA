        ja: このチャンネルのメッセージ読み上げを有効にします
        ko: 이 채널의 메시지 읽어주기를 켭니다.
        vi: Bật đọc tin nhắn cho kênh này.
        zh-CN: 为此频道启用消息朗读。
        zh-TW: 為此頻道啟用訊息朗讀。
