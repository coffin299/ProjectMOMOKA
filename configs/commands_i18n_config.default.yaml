        ja: TTS関連のコマンド
        ko: TTS 관련 명령
        vi: Các lệnh liên quan đến TTS.
        zh-CN: TTS 相关命令。
        zh-TW: TTS 相關指令。
        es: Comandos relacionados con TTS.
        fr: Commandes liées au TTS.
        de: TTS-bezogene Befehle.
        pt-BR: Comandos relacionados a TTS.
        ru: Команды, связанные с TTS.
        th: คำสั่งเกี่ยวกับ TTS
        id: Perintah terkait TTS.
    tts volume:
      description:
        en: Set TTS volume (0-200%).
        ja: TTSの音量を設定します (0-200%)
        ko: TTS 음량을 설정합니다(0-200%).
        vi: Đặt âm lượng TTS (0-200%).
        zh-CN: 设置 TTS 音量（0-200%）。
        zh-TW: 設定 TTS 音量（0-200%）。
        es: Ajusta el volumen TTS (0-200%).
        fr: Règle le volume TTS (0-200 %).
        de: Setzt die TTS-Lautstärke (0-200%).
        pt-BR: Define o volume TTS (0-200%).
        ru: Задаёт громкость TTS (0-200%).
        th: ตั้งระดับเสียง TTS (0-200%)
        id: Atur volume TTS (0-200%).
      options:
        volume:
          description:
            en: Volume (integer from 0 to 200).
            ja: 音量 (0から200の整数)
            ko: 음량(0~200 정수)
            vi: Âm lượng (số nguyên 0–200).
            zh-CN: 音量（0 到 200 的整数）。
            zh-TW: 音量（0 到 200 的整數）。
            es: Volumen (entero de 0 a 200).
            fr: Volume (entier de 0 à 200).
            de: Lautstärke (Ganzzahl 0–200).
            pt-BR: Volume (inteiro de 0 a 200).
            ru: Громкость (целое 0–200).
            th: ระดับเสียง (จำนวนเต็ม 0 ถึง 200)
            id: Volume (bilangan bulat 0–200).
    speech:
      description:
        en: Text channel read-aloud commands.
        ja: テキストチャンネルの読み上げに関するコマンド
        ko: 텍스트 채널 읽어주기 관련 명령
        vi: Lệnh đọc to kênh văn bản.
        zh-CN: 文字频道朗读相关命令。
        zh-TW: 文字頻道朗讀相關指令。
        es: Comandos de lectura en voz alta.
        fr: Commandes de lecture à voix haute.
        de: Befehle für Vorlesen im Textkanal.
        pt-BR: Comandos de leitura em voz alta.
        ru: Команды озвучки текстового канала.
        th: คำสั่งอ่านข้อความในช่องข้อความ
        id: Perintah baca nyaring saluran teks.
    speech enable:
      description:
