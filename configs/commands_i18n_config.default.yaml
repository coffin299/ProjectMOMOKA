        fr: Active la lecture des messages de ce salon.
        de: Aktiviert Vorlesen für diesen Kanal.
        pt-BR: Ativa leitura de mensagens neste canal.
        ru: Включает озвучку сообщений канала.
        th: เปิดการอ่านข้อความสำหรับช่องนี้
        id: Aktifkan baca pesan untuk saluran ini.
    speech disable:
      description:
        en: Disable message read-aloud.
        ja: メッセージ読み上げを無効にします
        ko: 메시지 읽어주기를 끕니다.
        vi: Tắt đọc tin nhắn.
        zh-CN: 禁用消息朗读。
        zh-TW: 停用訊息朗讀。
        es: Desactiva la lectura de mensajes.
        fr: Désactive la lecture des messages.
        de: Deaktiviert das Vorlesen.
        pt-BR: Desativa a leitura de mensagens.
        ru: Отключает озвучку сообщений.
        th: ปิดการอ่านข้อความ
        id: Nonaktifkan baca pesan.
    speech skip:
      description:
        en: Skip the current read-aloud.
        ja: 現在の読み上げをスキップします
        ko: 현재 읽어주기를 건너뜁니다.
        vi: Bỏ qua phần đang đọc.
        zh-CN: 跳过当前朗读。
        zh-TW: 跳過目前朗讀。
        es: Salta la lectura actual.
        fr: Passe la lecture en cours.
        de: Überspringt das aktuelle Vorlesen.
        pt-BR: Pula a leitura atual.
        ru: Пропускает текущую озвучку.
        th: ข้ามการอ่านปัจจุบัน
        id: Lewati bacaan saat ini.
    autojoin:
      description:
        en: Auto-join voice channel commands.
        ja: VCへの自動参加に関するコマンド
        ko: 음성 채널 자동 참여 관련 명령
        vi: Lệnh tự động tham gia kênh thoại.
        zh-CN: 自动加入语音频道相关命令。
        zh-TW: 自動加入語音頻道相關指令。
        es: Comandos de auto-unión al canal de voz.
        fr: Commandes d'auto-rejoindre le vocal.
        de: Befehle für Auto-Join im Sprachkanal.
        pt-BR: Comandos de entrada automática no canal de voz.
        ru: Команды автоподключения к голосовому каналу.
        th: คำสั่งเข้าร่วมช่องเสียงอัตโนมัติ
        id: Perintah auto-join saluran suara.
    autojoin enable:
      description:
