# =============================================================================
# Link Fix 設定（デフォルト）
# -----------------------------------------------------------------------------
# SNS / メディア URL の公式 embed を抑制し、Fix 系ドメインへ書き換えて
# Discord 上で正しくプレビューさせる機能の既定値です。
#
# ランタイムで実際に読み込まれるのは同ディレクトリの link_fix_config.yaml です。
# 本ファイル（*.default.yaml）は配布用テンプレート／フォールバックとして保持します。
# =============================================================================

link_fix:
  # 機能全体の既定オン/オフ（ギルド未設定時）。通常は /linkfix でギルド単位に有効化する
  enabled: false
  # Fix 後のボット返信を @silent で送るか（通知なし・チャンネル履歴には残る）
  silent: true
  # 元メッセージの公式 embed が付くまで待つ秒数（その後に抑制・書き換えを行う）
  embed_wait_seconds: 5.0
  # 書き換え後 URL の Fix 側 embed 待ち秒数。時間内に付かない場合は返信削除し元メッセージを復元
  fixed_embed_wait_seconds: 6.0
  # メッセージ本文にこの文字列が含まれる場合は Link Fix をスキップするキーワード
  ignore_keyword: fxignore
  # 返信末尾に付ける小さな注記（-# 行）。ギルドの preferred_locale が ja のときに使用
  footnote_ja: "設定は `/linkfix`"
  # 同上の英語版（preferred_locale が en など ja 以外のとき）
  footnote_en: "Manage via `/linkfix`"
  # 旧互換キー。footnote_ja / footnote_en 未設定環境向けフォールバック（コード側でも参照可）
  footnote: "Manage via `/linkfix`"
  # Twitter / Bluesky などの翻訳ボタン付き View の有効期限（秒）
  translation_view_timeout: 3600

  # ---------------------------------------------------------------------------
  # sites: サイト別のマッチ・書き換え定義（UI の選択肢と実際の書き換えが同じ定義を参照）
  #
  # 各サイトで共通する主なキー:
  #   label               … ダッシュボード / コマンド UI に表示する名称
  #   enabled             … このサイトを処理対象にするか（既定オン）
  #   default_fix_domain  … 未指定時に使う Fix 先ドメイン
  #   match_domains       … 検知対象の元ドメイン一覧（サブドメイン含む想定）
  #   path_patterns       … 対象にするパスのテンプレート（{id} 等はプレースホルダ）
  #   fixer_presets       … ユーザーが選べる Fix 先ドメインの候補リスト
  #   translation_domains … （任意）言語サフィックス翻訳に対応する Fix 先ドメイン
  #   rewrite_mode        … （任意）書き換え方式。省略時は通常のドメイン差し替え
  # ---------------------------------------------------------------------------
  sites:
    # Twitter / X — 投稿ステータス URL を FxTwitter 系へ
    twitter:
      label: Twitter / X
      enabled: true
      default_fix_domain: fxtwitter.com
      # 言語サフィックス付き翻訳 URL を生成できる Fix 先
      translation_domains:
        - fxtwitter.com
        - fixupx.com
        - twittpr.com
      match_domains:
        - x.com
        - twitter.com
        - nitter.net
        - xcancel.com
        - nitter.poast.org
        - nitter.privacyredirect.com
        - lightbrd.com
        - nitter.space
        - nitter.tiekoetter.com
      # status ID 付きパスのみ対象（プロフィール等は除外）
      path_patterns:
        - "/i/status/{id}"
        - "/{username}/status/{id}"
        - "/{username}/status/{id}/{media_type}/{media_id}"
      fixer_presets:
        - fxtwitter.com
        - fixupx.com
        - vxtwitter.com
        - twitterez.com

    # Instagram — 投稿 / リール / 共有リンク
    instagram:
      label: Instagram
      enabled: true
      default_fix_domain: fxstagram.com
      match_domains:
        - instagram.com
      path_patterns:
        - "/p/{id}"
        - "/reel/{id}"
        - "/reels/{id}"
        - "/{username}/p/{id}"
        - "/{username}/reel/{id}"
        - "/share/{id}"
        - "/share/p/{id}"
        - "/share/reel/{id}"
      fixer_presets:
        - fxstagram.com
        - ddinstagram.com
        - kkinstagram.com
        - vxinstagram.com

    # TikTok — 動画 / 写真 / 短縮・埋め込みリンク
    tiktok:
      label: TikTok
      enabled: true
      default_fix_domain: tnktok.com
      match_domains:
        - tiktok.com
      path_patterns:
        - "/{username}/video/{id}"
        - "/{username}/photo/{id}"
        - "/t/{id}"
        - "/embed/{id}"
      fixer_presets:
        - tnktok.com
        - vxtiktok.com
        - tiktokez.com
        - fixtiktok.com

    # Reddit — 投稿・共有・ユーザーコメントスレッド
    reddit:
      label: Reddit
      enabled: true
      default_fix_domain: vxreddit.com
      match_domains:
        - reddit.com
        - redditmedia.com
      path_patterns:
        - "/r/{subreddit}/comments/{id}"
        - "/r/{subreddit}/comments/{id}/{slug}"
        - "/r/{subreddit}/s/{id}"
        - "/u/{username}/comments/{id}"
        - "/user/{username}/comments/{id}"
      fixer_presets:
        - vxreddit.com
        - rxddit.com
        - redditez.com

    # Threads — Meta Threads の投稿 URL
    threads:
      label: Threads
      enabled: true
      default_fix_domain: fixthreads.net
      match_domains:
        - threads.net
        - threads.com
      path_patterns:
        - "/{username}/post/{id}"
      fixer_presets:
        - fixthreads.net
        - threadsez.net

    # Bluesky — bsky.app の投稿（翻訳サフィックス対応）
    bluesky:
      label: Bluesky
      enabled: true
      default_fix_domain: fxbsky.app
      # 言語サフィックス付き翻訳 URL を生成できる Fix 先
      translation_domains:
        - fxbsky.app
        - bskx.app
      match_domains:
        - bsky.app
      path_patterns:
        - "/profile/{username}/post/{id}"
      fixer_presets:
        - fxbsky.app
        - bskx.app
        - bsyy.app

    # Facebook — 投稿 / 動画 / リール / 共有 / watch
    facebook:
      label: Facebook
      enabled: true
      default_fix_domain: facebed.com
      match_domains:
        - facebook.com
      path_patterns:
        - "/{username}/posts/{hash}"
        - "/{username}/videos/{hash}"
        - "/reel/{id}"
        - "/share/v/{hash}"
        - "/share/r/{hash}"
        - "/share/p/{hash}"
        - "/watch"
      fixer_presets:
        - facebed.com
        - facebookez.com

    # Pixiv — イラスト作品ページ（言語プレフィックス付きパス含む）
    pixiv:
      label: Pixiv
      enabled: true
      default_fix_domain: phixiv.net
      match_domains:
        - pixiv.net
      path_patterns:
        - "/artworks/{id}"
        - "/{lang}/artworks/{id}"
      fixer_presets:
        - phixiv.net

    # Twitch — クリップ URL のみ（配信ページ等は対象外）
    twitch:
      label: Twitch Clips
      enabled: true
      default_fix_domain: fxtwitch.seria.moe
      match_domains:
        - twitch.tv
      path_patterns:
        - "/{username}/clip/{id}"
      fixer_presets:
        - fxtwitch.seria.moe

    # Spotify — トラック URL（言語プレフィックス付きパス含む）
    spotify:
      label: Spotify
      enabled: true
      default_fix_domain: fxspotify.com
      match_domains:
        - spotify.com
      path_patterns:
        - "/track/{id}"
        - "/{lang}/track/{id}"
      fixer_presets:
        - fxspotify.com

    # DeviantArt — アート / ジャーナル作品ページ
    deviantart:
      label: DeviantArt
      enabled: true
      default_fix_domain: fixdeviantart.com
      match_domains:
        - deviantart.com
      path_patterns:
        - "/{username}/art/{id}"
        - "/{username}/journal/{id}"
      fixer_presets:
        - fixdeviantart.com

    # Tumblr — 投稿 URL（ユーザー名付き・スラッグ付き含む）
    tumblr:
      label: Tumblr
      enabled: true
      default_fix_domain: tpmblr.com
      match_domains:
        - tumblr.com
      path_patterns:
        - "/post/{id}"
        - "/{username}/{id}"
        - "/{username}/{id}/{slug}"
      fixer_presets:
        - tpmblr.com

    # BiliBili — 動画 URL（短縮ドメイン b23.tv / b22.top 含む）。vx プレフィックス方式
    bilibili:
      label: BiliBili
      enabled: true
      # bilibili は「vx + 元ドメイン」形式（通常のドメイン差し替えではない）
      default_fix_domain: vxbilibili.com
      match_domains:
        - bilibili.com
        - b23.tv
        - b22.top
      path_patterns:
        - "/video/{id}"
        - "/{id}"
      fixer_presets:
        - vxbilibili.com
      # ドメイン差し替えではなく、ホスト先頭に vx を付ける方式
      rewrite_mode: vx_prefix

    # YouTube — watch / Shorts / youtu.be 短縮
    youtube:
      label: YouTube
      enabled: true
      default_fix_domain: koutube.com
      match_domains:
        - youtube.com
        - youtu.be
      path_patterns:
        - "/watch"
        - "/shorts/{id}"
        - "/{id}"
      fixer_presets:
        - koutube.com

    # Mastodon — 主要インスタンスのステータス URL
    mastodon:
      label: Mastodon
      enabled: true
      default_fix_domain: fx.zillanlabs.tech
      match_domains:
        - mastodon.social
        - mstdn.jp
        - mastodon.cloud
        - mstdn.social
        - mastodon.world
        - mastodon.online
        - mas.to
        - techhub.social
        - mastodon.uno
        - infosec.exchange
      path_patterns:
        - "/{username}/{id}"
      fixer_presets:
        - fx.zillanlabs.tech

    # Fur Affinity — 作品ビューページ
    furaffinity:
      label: Fur Affinity
      enabled: true
      default_fix_domain: xfuraffinity.net
      match_domains:
        - furaffinity.net
      path_patterns:
        - "/view/{id}"
      fixer_presets:
        - xfuraffinity.net

    # Newgrounds — アート作品ビューページ
    newgrounds:
      label: Newgrounds
      enabled: true
      default_fix_domain: fixnewgrounds.com
      match_domains:
        - newgrounds.com
      path_patterns:
        - "/art/view/{username}/{slug}"
      fixer_presets:
        - fixnewgrounds.com
